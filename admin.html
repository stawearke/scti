<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCTI Admin — Content Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C41E3A;--red-dk:#9e1830;--red-lt:#fff0f2;
  --gold:#D4AF37;--gold-lt:rgba(212,175,55,.13);
  --navy:#0a2540;--navy2:#0d3b5e;--navy-lt:#122d4a;
  --gray:#5a6680;--gray-lt:#f4f7fb;--border:#e2e8f0;
  --white:#fff;--r:12px;--rlg:18px;
  --sidebar:260px;
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:#eef1f6;color:#1a1a2e;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4,.syne{font-family:'Syne',sans-serif}
a{text-decoration:none}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.login-logo .lm{background:var(--red);width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:white;line-height:1.1;text-align:center}
.login-logo h1{font-size:1.1rem;font-weight:700;color:var(--navy)}
.login-logo p{font-size:.6rem;letter-spacing:2px;color:var(--gold);font-weight:700}
.lf-group{margin-bottom:18px}
.lf-group label{font-weight:600;font-size:.8rem;color:var(--gray);display:block;margin-bottom:6px}
.lf-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:.88rem;transition:.2s}
.lf-group input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(196,30,58,.1)}
.login-btn{width:100%;background:var(--red);color:white;border:none;padding:13px;border-radius:50px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Outfit',sans-serif;transition:.2s}
.login-btn:hover{background:var(--red-dk)}
.login-err{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:.8rem;margin-bottom:16px;display:none}

/* ── LAYOUT ── */
#appShell{display:none}
.admin-header{background:var(--navy);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:500;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.admin-header .brand{display:flex;align-items:center;gap:12px}
.admin-header .brand .lm{background:var(--red);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:white;line-height:1.1;text-align:center;flex-shrink:0}
.admin-header .brand span{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:white}
.admin-header .brand small{font-size:.58rem;color:var(--gold);letter-spacing:2px;display:block;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr-badge{background:rgba(255,255,255,.1);border-radius:50px;padding:5px 14px;font-size:.75rem;color:rgba(255,255,255,.8)}
.hdr-badge.live-on{background:var(--red);color:white;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.logout-btn{background:rgba(255,255,255,.12);border:none;color:white;padding:7px 16px;border-radius:50px;cursor:pointer;font-size:.78rem;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:7px;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.2)}

/* ── SIDEBAR ── */
.sidebar{position:fixed;top:62px;left:0;bottom:0;width:var(--sidebar);background:white;border-right:1px solid var(--border);overflow-y:auto;z-index:400;padding:16px 0}
.sidebar-section{font-size:.62rem;font-weight:700;letter-spacing:2px;color:var(--gray);padding:14px 20px 6px;opacity:.6}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 20px;cursor:pointer;transition:all .18s;border-left:3px solid transparent;color:var(--gray);font-size:.85rem;font-weight:500}
.sb-item:hover{background:var(--gray-lt);color:var(--navy)}
.sb-item.on{background:var(--red-lt);border-left-color:var(--red);color:var(--red);font-weight:700}
.sb-item i{width:20px;text-align:center;font-size:.85rem}
.sb-item .sb-count{margin-left:auto;background:var(--red);color:white;border-radius:50px;font-size:.6rem;padding:2px 7px;font-weight:700}
.sb-item.on .sb-count{background:var(--navy)}

/* ── MAIN ── */
.main{margin-left:var(--sidebar);margin-top:62px;padding:28px;min-height:calc(100vh - 62px)}

/* ── TOASTS ── */
#toast{position:fixed;bottom:28px;right:28px;z-index:9000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy);color:white;padding:12px 18px;border-radius:12px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .3s ease;max-width:320px}
.toast.success{background:#065f46;border-left:4px solid #10b981}
.toast.error{background:#991b1b;border-left:4px solid var(--red)}
.toast.info{background:var(--navy);border-left:4px solid var(--gold)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── CARDS ── */
.card{background:white;border-radius:var(--rlg);padding:24px;border:1px solid var(--border);margin-bottom:24px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.card-header h2{font-size:1.1rem;font-weight:700;color:var(--navy)}
.card-header .ch-left{display:flex;align-items:center;gap:10px}
.card-header .ch-icon{width:34px;height:34px;background:var(--red-lt);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:.9rem}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:white;border-radius:var(--rlg);padding:20px;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09);border-color:var(--red)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
.stat-num{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--navy);line-height:1}
.stat-lbl{font-size:.75rem;color:var(--gray);margin-top:4px;font-weight:500}
.stat-icon{position:absolute;top:16px;right:16px;font-size:1.5rem;opacity:.08;color:var(--navy)}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.cols3{grid-template-columns:repeat(3,1fr)}
.fg{margin-bottom:0}
.fg.s2{grid-column:span 2}
.fg.s3{grid-column:span 3}
label{font-weight:600;display:block;margin-bottom:5px;color:var(--navy);font-size:.78rem}
label .r{color:var(--red)}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Outfit',sans-serif;font-size:.85rem;color:#1a1a2e;transition:.2s;background:white}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(196,30,58,.08)}
input[type="checkbox"]{width:auto;accent-color:var(--red)}
.form-sep{grid-column:1/-1;border:none;border-top:1px solid var(--border);margin:6px 0}
.form-sep-label{grid-column:1/-1;font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;color:var(--red);padding-top:4px;display:flex;align-items:center;gap:8px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:50px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-size:.82rem;padding:9px 18px}
.btn-red{background:var(--red);color:white}
.btn-red:hover{background:var(--red-dk);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#b8942a}
.btn-navy{background:var(--navy);color:white}
.btn-navy:hover{background:var(--navy2)}
.btn-outline{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn-outline:hover{background:var(--red);color:white}
.btn-ghost{background:var(--gray-lt);color:var(--gray);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:#dc2626;color:white}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 12px;font-size:.74rem}
.btn-lg{padding:12px 26px;font-size:.9rem}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--gray-lt);font-weight:700;padding:11px 14px;text-align:left;color:var(--navy);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--border);color:var(--gray);vertical-align:middle}
tr:hover td{background:#fafbfc}
.td-thumb{width:52px;height:40px;border-radius:7px;object-fit:cover;background:#e2e8f0}
.td-thumb:not([src]),.slide-preview:not([src]),.gi img:not([src]){background:linear-gradient(135deg,#e2e8f0,#f4f7fb);display:block}
.td-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:50px;font-size:.65rem;font-weight:700}
.badge-red{background:var(--red-lt);color:var(--red)}
.badge-gold{background:var(--gold-lt);color:#8a6a00}
.badge-green{background:#d1fae5;color:#065f46}
.badge-live{background:var(--red);color:white;animation:pulse 2s infinite}
.badge-navy{background:rgba(10,37,64,.08);color:var(--navy)}

/* ── GALLERY GRID ── */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.gi{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:#eee;border:1px solid var(--border)}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.gi:hover img{transform:scale(1.04)}
.gi-del{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);color:white;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.gi:hover .gi-del{opacity:1}
.gi-order{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:white;font-size:.62rem;padding:2px 7px;border-radius:50px}

/* ── SLIDES ── */
.slide-row{background:var(--gray-lt);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--border);display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:start}
.slide-preview{width:90px;height:60px;border-radius:8px;object-fit:cover;border:2px solid var(--border)}
.slide-handle{cursor:grab;color:var(--gray);padding:4px}

/* ── SETTINGS GRID ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ── APP MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal-box{background:white;border-radius:var(--rlg);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:10}
.modal-head h3{font-size:1rem;color:var(--navy)}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:1.2rem;line-height:1}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--gray-lt);border-radius:0 0 var(--rlg) var(--rlg)}

/* ── APPLICATIONS TABLE ── */
.app-status{display:inline-flex;align-items:center;gap:5px}
.status-dot{width:7px;height:7px;border-radius:50%}
.status-pending .status-dot{background:#f59e0b}
.status-approved .status-dot{background:#10b981}
.status-rejected .status-dot{background:var(--red)}
.status-contacted .status-dot{background:#6366f1}

/* ── LOADING ── */
.loading-row td{text-align:center;padding:40px;color:var(--gray);font-size:.85rem}
.spinner{width:24px;height:24px;border:2px solid var(--red-lt);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:52px 24px;color:var(--gray)}
.empty-state i{font-size:3rem;opacity:.18;margin-bottom:14px;color:var(--navy)}
.empty-state p{font-size:.88rem}

/* ── CONTACT ENQUIRIES ── */
.enquiry-row{background:var(--gray-lt);border-radius:var(--r);padding:14px 18px;margin-bottom:10px;border:1px solid var(--border)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-260px);transition:.3s;width:260px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .form-grid,.settings-grid{grid-template-columns:1fr}
  .fg.s2,.fg.s3{grid-column:span 1}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="lm">SC<br>TI</div>
      <div>
        <h1>SCTI Admin</h1>
        <p>CONTENT MANAGEMENT SYSTEM</p>
      </div>
    </div>
    <div id="loginErr" class="login-err"></div>
    <div class="lf-group"><label>Admin Username</label><input type="text" id="loginUser" placeholder="admin" autocomplete="username"></div>
    <div class="lf-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell">
  <!-- Header -->
  <header class="admin-header">
    <div class="brand">
      <div class="lm">SC<br>TI</div>
      <div><span>SCTI Admin</span><small>CONTENT MANAGEMENT</small></div>
    </div>
    <div class="hdr-right">
      <span class="hdr-badge" id="liveStatusBadge"><i class="fas fa-circle" style="font-size:.5rem"></i> No Live Stream</span>
      <span class="hdr-badge" id="syncBadge" style="cursor:pointer" onclick="syncIndicator()"><i class="fas fa-database"></i> <span id="syncLabel">Synced</span></span>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">OVERVIEW</div>
    <div class="sb-item on" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
    <div class="sb-item" data-page="applications"><i class="fas fa-file-alt"></i> Applications <span class="sb-count" id="appCount">0</span></div>
    <div class="sb-item" data-page="enquiries"><i class="fas fa-envelope"></i> Enquiries <span class="sb-count" id="enqCount">0</span></div>
    <div class="sidebar-section">WEBSITE CONTENT</div>
    <div class="sb-item" data-page="hero"><i class="fas fa-image"></i> Hero Slides <span class="sb-count" id="heroCount">0</span></div>
    <div class="sb-item" data-page="courses"><i class="fas fa-book-open"></i> Courses <span class="sb-count" id="courseCount">0</span></div>
    <div class="sb-item" data-page="events"><i class="fas fa-calendar-alt"></i> Events <span class="sb-count" id="eventCount">0</span></div>
    <div class="sb-item" data-page="gallery"><i class="fas fa-images"></i> Gallery <span class="sb-count" id="galCount">0</span></div>
    <div class="sidebar-section">SETTINGS</div>
    <div class="sb-item" data-page="settings"><i class="fas fa-cog"></i> Site Settings</div>
    <div class="sb-item" data-page="live"><i class="fas fa-video"></i> Live Stream</div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <div style="text-align:center;padding:80px 0">
      <div class="spinner"></div>
      <p style="margin-top:12px;color:var(--gray)">Loading…</p>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-bg" id="globalModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Edit</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ════════════════════════════════
   SUPABASE
════════════════════════════════ */
function imgErr(el, size){
  var svgs={
    sm:"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2240%22%3E%3Crect width=%2252%22 height=%2240%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2226%22 y=%2222%22 text-anchor=%22middle%22 font-size=%228%22 fill=%22%23999%22%3EIMG%3C/text%3E%3C/svg%3E",
    md:"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22%3E%3Crect width=%22150%22 height=%22150%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2275%22 y=%2278%22 text-anchor=%22middle%22 font-size=%2212%22 fill=%22%23999%22%3EIMG%3C/text%3E%3C/svg%3E",
    lg:"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2260%22%3E%3Crect width=%2290%22 height=%2260%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2245%22 y=%2232%22 text-anchor=%22middle%22 font-size=%229%22 fill=%22%23999%22%3EIMG%3C/text%3E%3C/svg%3E"
  };
  el.onerror=null; el.src=svgs[size]||svgs.sm;
}

const SB_URL  = 'https://iuskmfphmraighipmsmh.supabase.co';
const SB_ANON = 'sb_publishable_473bcG4eRXPZfqKHR7T47A_qpYNQQWQ';
const sb = supabase.createClient(SB_URL, SB_ANON);

/* ════════════════════════════════
   AUTH
════════════════════════════════ */
const ADMIN_CREDS = { user: 'admin', pass: 'scti@2025' };
let isLoggedIn = sessionStorage.getItem('scti_admin_auth') === '1';

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if(u === ADMIN_CREDS.user && p === ADMIN_CREDS.pass){
    sessionStorage.setItem('scti_admin_auth','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appShell').style.display='block';
    initApp();
  } else {
    const e = document.getElementById('loginErr');
    e.textContent='Invalid username or password.';
    e.style.display='block';
    setTimeout(()=>e.style.display='none',3000);
  }
}
function doLogout(){
  sessionStorage.removeItem('scti_admin_auth');
  location.reload();
}

if(isLoggedIn){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';
}

/* ════════════════════════════════
   APP INIT
════════════════════════════════ */
let DB = { events:[], courses:[], gallery:[], hero_slides:[], settings:{}, applications:[], enquiries:[] };
let currentPage = 'dashboard';

async function initApp(){
  await loadAllData();
  setupNav();
  goPage('dashboard');
}

async function loadAllData(){
  try{
    const [evR,coR,galR,heroR,setR,appR,enqR] = await Promise.all([
      sb.from('events').select('*').order('date',{ascending:true}),
      sb.from('courses').select('*').order('sort_order',{ascending:true}),
      sb.from('gallery').select('*').order('sort_order',{ascending:true}),
      sb.from('hero_slides').select('*').order('sort_order',{ascending:true}),
      sb.from('settings').select('*'),
      sb.from('applications').select('*').order('created_at',{ascending:false}),
      sb.from('contact_enquiries').select('*').order('created_at',{ascending:false})
    ]);
    if(evR.data)  DB.events       = evR.data;
    if(coR.data)  DB.courses      = coR.data;
    if(galR.data) DB.gallery      = galR.data;
    if(heroR.data)DB.hero_slides  = heroR.data;
    if(setR.data){DB.settings={}; setR.data.forEach(s=>DB.settings[s.key]=s.value);}
    if(appR.data) DB.applications = appR.data;
    if(enqR.data) DB.enquiries    = enqR.data;
  }catch(e){ toast('Failed to load some data: '+e.message,'error'); }
  updateCounts();
  updateLiveBadge();
}

function S(k){ return DB.settings[k]||''; }

function updateCounts(){
  qs('#appCount').textContent   = DB.applications.length;
  qs('#enqCount').textContent   = DB.enquiries.length;
  qs('#heroCount').textContent  = DB.hero_slides.length;
  qs('#courseCount').textContent= DB.courses.length;
  qs('#eventCount').textContent = DB.events.length;
  qs('#galCount').textContent   = DB.gallery.length;
}
function updateLiveBadge(){
  const live = DB.events.find(e=>e.is_live);
  const badge = qs('#liveStatusBadge');
  if(live){
    badge.innerHTML=`<i class="fas fa-circle" style="color:#f87171;font-size:.5rem"></i> LIVE: ${live.title.substring(0,22)}…`;
    badge.classList.add('live-on');
  } else {
    badge.innerHTML=`<i class="fas fa-circle" style="font-size:.5rem"></i> No Live Stream`;
    badge.classList.remove('live-on');
  }
}

function qs(s,ctx=document){return ctx.querySelector(s);}
function qsa(s,ctx=document){return ctx.querySelectorAll(s);}

/* ════════════════════════════════

════════════════════════════════ */
function setupNav(){
  qsa('.sb-item').forEach(el=>{
    el.addEventListener('click',()=>{ goPage(el.dataset.page); });
  });
}
function goPage(page){
  currentPage = page;
  qsa('.sb-item').forEach(el=>el.classList.toggle('on', el.dataset.page===page));
  const pages = {
    dashboard: pageFn_dashboard, applications: pageFn_applications, enquiries: pageFn_enquiries, hero: pageFn_hero, courses: pageFn_courses, events: pageFn_events, gallery: pageFn_gallery, settings: pageFn_settings, live: pageFn_live
  };
  const fn = pages[page];
  if(fn) qs('#mainContent').innerHTML = fn();
  else qs('#mainContent').innerHTML = `<p>Page not found</p>`;
  // post-render
  if(page==='gallery') initGalleryDrop();
}

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
function toast(msg, type='success'){
  const icon = type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':'fa-info-circle';
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
  qs('#toast').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

/* ════════════════════════════════
   MODAL
════════════════════════════════ */
function openModal(title, body, foot, width){
  qs('#modalTitle').textContent = title;
  qs('#modalBody').innerHTML = body;
  qs('#modalFoot').innerHTML = foot||`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  const box = qs('.modal-box');
  if(box) box.style.maxWidth = width||'680px';
  qs('#globalModal').classList.add('on');
}
function closeModal(){ qs('#globalModal').classList.remove('on'); }

/* ════════════════════════════════
   fmtDate
════════════════════════════════ */
function fmtDate(d){ if(!d) return ''; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtTs(d){ if(!d) return ''; return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.updateAppStatus = async function(id, status){
  const {error} = await sb.from('applications').update({status}).eq('id',id);
  if(error){ toast('Failed to update: '+error.message,'error'); return; }
  const a = DB.applications.find(x=>x.id===id); if(a) a.status=status;
  toast('Status updated to: '+status);
};

window.deleteApp = async function(id){
  if(!confirm('Delete this application? This cannot be undone.')) return;
  const {error} = await sb.from('applications').delete().eq('id',id);
  if(error){ toast('Delete failed','error'); return; }
  DB.applications = DB.applications.filter(x=>x.id!==id);
  updateCounts(); goPage('applications');
  toast('Application deleted');
};

window.exportApplications = function(){
  const headers = ['full_name','email','phone','course_name','study_level','study_mode','intake_month','county','town','highest_education','how_heard','status','created_at'];
  const csv = [headers.join(','), ...DB.applications.map(a=>headers.map(h=>`"${(a[h]||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `scti_applications_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  toast('Applications exported as CSV');
};

window.saveCourse = async function(id){
  const rawLearn = qs('#c_learn').value.trim();
  const rawCurr  = qs('#c_curr').value.trim();
  const rawFaqs  = qs('#c_faqs').value.trim();
  if(rawCurr){ try{ JSON.parse(rawCurr); }catch(e){ toast('Curriculum JSON is invalid. Check format.','error'); return; } }
  if(rawFaqs){ try{ JSON.parse(rawFaqs); }catch(e){ toast('FAQs JSON is invalid. Check format.','error'); return; } }
  const payload = {
    name:          qs('#c_name').value.trim(),
    category:      qs('#c_cat').value,
    duration:      qs('#c_dur').value.trim(),
    fee:           qs('#c_fee').value.trim(),
    levels:        qs('#c_levels').value.trim(),
    mode:          qs('#c_mode').value.trim(),
    description:   qs('#c_desc').value.trim(),
    requirements:  qs('#c_req').value.trim(),
    careers:       qs('#c_careers').value.trim(),
    what_you_learn:rawLearn,
    curriculum:    rawCurr,
    faqs:          rawFaqs,
    intake_dates:  qs('#c_intakes').value.trim(),
    image_url:     qs('#c_img').value.trim(),
    gallery_urls:  qs('#c_gal').value.trim(),
    sort_order:    parseInt(qs('#c_order').value)||99,
    featured:      qs('#c_featured')?.checked||false
  };
  if(!payload.name){ toast('Course name required','error'); return; }
  let error;
  if(id){
    ({error} = await sb.from('courses').update(payload).eq('id',id));
    if(!error){ const c=DB.courses.find(x=>x.id===id); if(c) Object.assign(c,payload); }
  } else {
    const {data,error:e} = await sb.from('courses').insert([payload]).select();
    error=e; if(!error && data) DB.courses.push(data[0]);
  }
  if(error){ toast('Save failed: '+error.message,'error'); return; }
  updateCounts(); closeModal(); goPage('courses'); toast('Course saved!');
};

window.saveGalleryImages = async function(){
  const raw = qs('#g_urls').value;
  const urls = raw.split(/[\n,]+/).map(u=>u.trim()).filter(Boolean);
  if(!urls.length){ toast('Enter at least one URL','error'); return; }
  const caption = qs('#g_caption').value.trim()||'SCTI Campus';
  let baseOrder = parseInt(qs('#g_order').value)||DB.gallery.length+1;
  const rows = urls.map((url,i)=>({url, caption, sort_order: baseOrder+i}));
  const {data,error} = await sb.from('gallery').insert(rows).select();
  if(error){ toast('Save failed: '+error.message,'error'); return; }
  if(data) DB.gallery.push(...data);
  updateCounts(); closeModal(); goPage('gallery'); toast(`${urls.length} image(s) added!`);

    ['footer_text','Footer Tagline','text'],['cta_title','CTA Title','text'],
    ['cta_subtitle','CTA Subtitle','text'],['facebook','Facebook URL','url'],
    ['instagram','Instagram URL','url'],['tiktok','TikTok URL','url'],
    ['youtube','YouTube URL','url'],['twitter','X/Twitter URL','url'],
  ];

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <h1 style="font-size:1.3rem;font-family:'Syne',sans-serif;color:var(--navy)"><i class="fas fa-cog" style="color:var(--red);margin-right:8px"></i>Site Settings</h1>
    <button class="btn btn-red" onclick="saveSettings()"><i class="fas fa-save"></i> Save All Settings</button>
  </div>
  <div class="card">
    <div class="settings-grid">
      ${fields.map(([k,lbl,type])=>type==='textarea'
        ?`<div class="fg" style="grid-column:span 2"><label>${lbl}</label><textarea id="st_${k}" rows="3">${esc(S(k))}</textarea></div>`
        :`<div class="fg"><label>${lbl}</label><input id="st_${k}" type="${type}" value="${esc(S(k))}"></div>`
      ).join('')}
    </div>
    <div style="margin-top:20px;text-align:right">
      <button class="btn btn-red btn-lg" onclick="saveSettings()"><i class="fas fa-save"></i> Save All Settings</button>
    </div>
  </div>`;
}

window.saveSettings = async function(){
  const keys = ['site_name','phone1','phone2','whatsapp','email','address','working_hours','students_count','courses_count','years_count','placement_rate','about_text','footer_text','cta_title','cta_subtitle','facebook','instagram','tiktok','youtube','twitter'];
  const btn = document.querySelector('.btn-red.btn-lg');
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving…'; }
  const upserts = keys.map(k=>({ key:k, value: (qs(`#st_${k}`)?.value||'').trim() }));
  const {error} = await sb.from('settings').upsert(upserts, {onConflict:'key'});
  if(btn){ btn.disabled=false; btn.innerHTML='<i class="fas fa-save"></i> Save All Settings'; }
  if(error){ toast('Save failed: '+error.message,'error'); return; }
  keys.forEach(k=>{ DB.settings[k]=(qs(`#st_${k}`)?.value||'').trim(); });
  toast('All settings saved!');
};

/* ════════════════════════════════
   LIVE STREAM
════════════════════════════════ */
function pageFn_live(){
  const liveEvent = DB.events.find(e=>e.is_live);
  return `
  <div style="margin-bottom:20px">
    <h1 style="font-size:1.3rem;font-family:'Syne',sans-serif;color:var(--navy)"><i class="fas fa-video" style="color:var(--red);margin-right:8px"></i>Live Stream Control</h1>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="card">
      <div class="card-header"><div class="ch-left"><div class="ch-icon"><i class="fas fa-circle"></i></div><h2>Current Status</h2></div></div>
      ${liveEvent ? `
        <div style="background:var(--red-lt);border:1px solid rgba(196,30,58,.25);border-radius:12px;padding:16px;margin-bottom:16px">
          <span class="badge badge-live" style="margin-bottom:8px"><i class="fas fa-circle"></i> LIVE</span>
          <p style="font-size:.9rem;font-weight:700;color:var(--navy)">${esc(liveEvent.title)}</p>
          <p style="font-size:.8rem;color:var(--gray)">${esc(liveEvent.location)} · ${esc(liveEvent.time)}</p>
          ${liveEvent.video_url?`<p style="font-size:.75rem;color:var(--gray);margin-top:6px;word-break:break-all">${esc(liveEvent.video_url)}</p>`:''}
        </div>
        <button class="btn btn-danger btn-lg" style="width:100%;justify-content:center" onclick="toggleLiveEvent(${liveEvent.id},false)"><i class="fas fa-stop-circle"></i> Stop Live Stream</button>
      ` : `
        <div style="text-align:center;padding:32px 20px;background:var(--gray-lt);border-radius:12px;margin-bottom:16px">
          <i class="fas fa-video" style="font-size:2.5rem;opacity:.2;color:var(--navy)"></i>
          <p style="color:var(--gray);font-size:.85rem;margin-top:10px">No event is currently live</p>
        </div>
        <p style="font-size:.8rem;color:var(--gray)">To go live, go to <strong>Events</strong> and check the "Is Live" toggle on the event you want to stream.</p>
      `}
    </div>
    <div class="card">
      <div class="card-header"><div class="ch-left"><div class="ch-icon"><i class="fas fa-list"></i></div><h2>Set Any Event Live</h2></div></div>
      ${DB.events.map(e=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
          <div>
            <p style="font-size:.83rem;font-weight:600;color:var(--navy)">${esc(e.title)}</p>
            <p style="font-size:.74rem;color:var(--gray)">${fmtDate(e.date)}</p>
          </div>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0">
            <input type="checkbox" ${e.is_live?'checked':''} onchange="toggleLiveEvent(${e.id},this.checked)">
            ${e.is_live?'<span class="badge badge-live" style="font-size:.6rem">LIVE</span>':''}
          </label>
        </div>`).join('') || '<p style="text-align:center;padding:20px;color:var(--gray)">No events yet. Add events first.</p>'}
    </div>
  </div>`;
}
