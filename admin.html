<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCTI Admin — CMS</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwADhQGAWjR9awAAAABJRU5ErkJggg==">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C41E3A;--red-dk:#9e1830;--red-lt:#fff0f2;
  --gold:#D4AF37;--gold-lt:rgba(212,175,55,.13);
  --navy:#0a2540;--navy2:#0d3b5e;
  --gray:#5a6680;--gray-lt:#f4f7fb;--border:#e2e8f0;
  --r:12px;--rlg:18px;--sidebar:260px;
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:#eef1f6;color:#1a1a2e;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
a{text-decoration:none}
/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.lm{background:var(--red);width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:white;line-height:1.2;text-align:center;flex-shrink:0}
.login-logo h1{font-size:1.1rem;font-weight:700;color:var(--navy)}
.login-logo p{font-size:.6rem;letter-spacing:2px;color:var(--gold);font-weight:700}
.lf-group{margin-bottom:18px}
.lf-group label{font-weight:600;font-size:.8rem;color:var(--gray);display:block;margin-bottom:6px}
.lf-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:.88rem;transition:.2s}
.lf-group input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(196,30,58,.1)}
.login-btn{width:100%;background:var(--red);color:white;border:none;padding:13px;border-radius:50px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Outfit',sans-serif;transition:.2s}
.login-btn:hover{background:var(--red-dk)}
.login-err{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:.8rem;margin-bottom:16px;display:none}
/* LAYOUT */
#appShell{display:none}
.admin-hdr{background:var(--navy);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:500;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-lm{background:var(--red);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:white;line-height:1.2;text-align:center;flex-shrink:0}
.hdr-brand span{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:white}
.hdr-brand small{font-size:.58rem;color:var(--gold);letter-spacing:2px;display:block;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr-badge{background:rgba(255,255,255,.1);border-radius:50px;padding:5px 14px;font-size:.75rem;color:rgba(255,255,255,.8)}
.hdr-badge.live-on{background:var(--red);color:white;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.logout-btn{background:rgba(255,255,255,.12);border:none;color:white;padding:7px 16px;border-radius:50px;cursor:pointer;font-size:.78rem;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:7px;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.2)}
/* SIDEBAR */
.sidebar{position:fixed;top:62px;left:0;bottom:0;width:var(--sidebar);background:white;border-right:1px solid var(--border);overflow-y:auto;z-index:400;padding:16px 0}
.sb-sec{font-size:.62rem;font-weight:700;letter-spacing:2px;color:var(--gray);padding:14px 20px 6px;opacity:.6}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 20px;cursor:pointer;transition:all .18s;border-left:3px solid transparent;color:var(--gray);font-size:.85rem;font-weight:500}
.sb-item:hover{background:var(--gray-lt);color:var(--navy)}
.sb-item.on{background:var(--red-lt);border-left-color:var(--red);color:var(--red);font-weight:700}
.sb-item i{width:20px;text-align:center;font-size:.85rem}
.sb-count{margin-left:auto;background:var(--red);color:white;border-radius:50px;font-size:.6rem;padding:2px 7px;font-weight:700}
.sb-item.on .sb-count{background:var(--navy)}
/* MAIN */
.main{margin-left:var(--sidebar);margin-top:62px;padding:28px;min-height:calc(100vh - 62px)}
/* TOAST */
#toastWrap{position:fixed;bottom:28px;right:28px;z-index:9000;display:flex;flex-direction:column;gap:10px}
.toast-item{color:white;padding:12px 18px;border-radius:12px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .3s ease;max-width:320px}
.toast-item.ok{background:#065f46;border-left:4px solid #10b981}
.toast-item.err{background:#991b1b;border-left:4px solid var(--red)}
.toast-item.info{background:var(--navy);border-left:4px solid var(--gold)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
/* CARDS */
.card{background:white;border-radius:var(--rlg);padding:24px;border:1px solid var(--border);margin-bottom:24px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.card-hdr h2{font-size:1.1rem;font-weight:700;color:var(--navy)}
.ch-left{display:flex;align-items:center;gap:10px}
.ch-icon{width:34px;height:34px;background:var(--red-lt);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:.9rem}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:white;border-radius:var(--rlg);padding:20px;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09);border-color:var(--red)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
.stat-num{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--navy);line-height:1}
.stat-lbl{font-size:.75rem;color:var(--gray);margin-top:4px;font-weight:500}
.stat-icon{position:absolute;top:16px;right:16px;font-size:1.5rem;opacity:.08;color:var(--navy)}
/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg{margin-bottom:0}
.fg.s2{grid-column:span 2}
.form-label{font-weight:600;display:block;margin-bottom:5px;color:var(--navy);font-size:.78rem}
.form-label .r{color:var(--red)}
.form-sep{grid-column:1/-1;border:none;border-top:1px solid var(--border);margin:4px 0}
.form-sep-lbl{grid-column:1/-1;font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;color:var(--red);padding-top:4px;display:flex;align-items:center;gap:8px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Outfit',sans-serif;font-size:.85rem;color:#1a1a2e;transition:.2s;background:white}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(196,30,58,.08)}
input[type="checkbox"]{width:auto;accent-color:var(--red)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:50px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-size:.82rem;padding:9px 18px}
.btn-red{background:var(--red);color:white}.btn-red:hover{background:var(--red-dk);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:#b8942a}
.btn-navy{background:var(--navy);color:white}.btn-navy:hover{background:var(--navy2)}
.btn-outline{background:transparent;border:1.5px solid var(--red);color:var(--red)}.btn-outline:hover{background:var(--red);color:white}
.btn-ghost{background:var(--gray-lt);color:var(--gray);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--border)}
.btn-danger{background:#dc2626;color:white}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 12px;font-size:.74rem}
.btn-lg{padding:12px 26px;font-size:.9rem}
/* TABLES */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--gray-lt);font-weight:700;padding:11px 14px;text-align:left;color:var(--navy);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--border);color:var(--gray);vertical-align:middle}
tr:hover td{background:#fafbfc}
.td-thumb{width:52px;height:40px;border-radius:7px;object-fit:cover;background:var(--gray-lt)}
.td-acts{display:flex;gap:6px;flex-wrap:wrap}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:50px;font-size:.65rem;font-weight:700}
.badge-red{background:var(--red-lt);color:var(--red)}
.badge-gold{background:var(--gold-lt);color:#8a6a00}
.badge-green{background:#d1fae5;color:#065f46}
.badge-navy{background:rgba(10,37,64,.08);color:var(--navy)}
.badge-live{background:var(--red);color:white;animation:pulse 2s infinite}
/* GALLERY */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.gi{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:#eee;border:1px solid var(--border)}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.gi:hover img{transform:scale(1.04)}
.gi-del{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);color:white;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.gi:hover .gi-del{opacity:1}
/* SLIDE ROW */
.slide-row{background:var(--gray-lt);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--border);display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:start}
.slide-img{width:90px;height:60px;border-radius:8px;object-fit:cover;border:2px solid var(--border);background:var(--gray-lt)}
/* SETTINGS */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal-box{background:white;border-radius:var(--rlg);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:10}
.modal-head h3{font-size:1rem;color:var(--navy)}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:1.2rem;line-height:1}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--gray-lt);border-radius:0 0 var(--rlg) var(--rlg)}
/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--red-lt);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:52px 24px;color:var(--gray)}
.empty-state i{font-size:3rem;opacity:.18;margin-bottom:14px;color:var(--navy);display:block}
/* RESPONSIVE */
@media(max-width:900px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-260px);transition:.3s;width:260px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .form-grid,.settings-grid{grid-template-columns:1fr}
  .fg.s2{grid-column:span 1}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="lm">SC<br>TI</div>
      <div><h1>SCTI Admin</h1><p>CONTENT MANAGEMENT</p></div>
    </div>
    <div id="loginErr" class="login-err"></div>
    <div class="lf-group"><label>Username</label><input type="text" id="loginUser" placeholder="admin" autocomplete="username"></div>
    <div class="lf-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </div>
</div>

<div id="appShell">
  <header class="admin-hdr">
    <div class="hdr-brand">
      <div class="hdr-lm">SC<br>TI</div>
      <div><span>SCTI Admin</span><small>CONTENT MANAGEMENT</small></div>
    </div>
    <div class="hdr-right">
      <span class="hdr-badge" id="liveBadge"><i class="fas fa-circle" style="font-size:.5rem"></i> No Live Stream</span>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sb-sec">OVERVIEW</div>
    <div class="sb-item on" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
    <div class="sb-item" data-page="applications"><i class="fas fa-file-alt"></i> Applications <span class="sb-count" id="cntApp">0</span></div>
    <div class="sb-item" data-page="enquiries"><i class="fas fa-envelope"></i> Enquiries <span class="sb-count" id="cntEnq">0</span></div>
    <div class="sb-sec">WEBSITE CONTENT</div>
    <div class="sb-item" data-page="hero"><i class="fas fa-image"></i> Hero Slides <span class="sb-count" id="cntHero">0</span></div>
    <div class="sb-item" data-page="courses"><i class="fas fa-book-open"></i> Courses <span class="sb-count" id="cntCourse">0</span></div>
    <div class="sb-item" data-page="events"><i class="fas fa-calendar-alt"></i> Events <span class="sb-count" id="cntEvent">0</span></div>
    <div class="sb-item" data-page="gallery"><i class="fas fa-images"></i> Gallery <span class="sb-count" id="cntGal">0</span></div>
    <div class="sb-sec">SETTINGS</div>
    <div class="sb-item" data-page="settings"><i class="fas fa-cog"></i> Site Settings</div>
    <div class="sb-item" data-page="live"><i class="fas fa-video"></i> Live Stream</div>
  </aside>

  <main class="main" id="mainContent">
    <div style="text-align:center;padding:80px 0"><div class="spinner"></div><p style="margin-top:12px;color:var(--gray)">Loading…</p></div>
  </main>
</div>

<div class="modal-bg" id="globalModal">
  <div class="modal-box" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">Edit</h3>
      <button class="modal-close" id="modalCloseBtn">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toastWrap"></div>

<script>
(function() {
'use strict';

/* ── SUPABASE ── */
const SB_URL  = 'https://iuskmfphmraighipmsmh.supabase.co';
const SB_ANON = 'sb_publishable_473bcG4eRXPZfqKHR7T47A_qpYNQQWQ';
// Use anon key for reads; for writes we use same key but RLS must allow it
// TO FIX 401 errors: In Supabase Dashboard -> Authentication -> Policies
// Enable INSERT/UPDATE/DELETE for anon role on: events, courses, gallery, 
// hero_slides, settings, applications, contact_enquiries tables
// OR replace SB_ANON above with your service_role key (Settings -> API)
const sb = supabase.createClient(SB_URL, SB_ANON);

/* ── AUTH ── */
const CREDS = { user: 'admin', pass: 'scti@2025' };
let authed = sessionStorage.getItem('scti_adm') === '1';

function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if (u === CREDS.user && p === CREDS.pass) {
    sessionStorage.setItem('scti_adm','1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    initApp();
  } else {
    var el = document.getElementById('loginErr');
    el.textContent = 'Invalid username or password.';
    el.style.display = 'block';
    setTimeout(function(){ el.style.display='none'; }, 3000);
  }
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', function(){
  sessionStorage.removeItem('scti_adm');
  location.reload();
});
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

if (authed) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
}

/* ── DATA STORE ── */
var DB = { events:[], courses:[], gallery:[], slides:[], settings:{}, applications:[], enquiries:[] };
var currentPage = 'dashboard';
var editingId = null;

/* ── INIT ── */
async function initApp() {
  await loadAll();
  setupNav();
  renderPage('dashboard');
}

async function loadAll() {
  try {
    var results = await Promise.all([
      sb.from('events').select('*').order('date', {ascending:true}),
      sb.from('courses').select('*').order('sort_order', {ascending:true}),
      sb.from('gallery').select('*').order('sort_order', {ascending:true}),
      sb.from('hero_slides').select('*').order('sort_order', {ascending:true}),
      sb.from('settings').select('*'),
      sb.from('applications').select('*').order('created_at', {ascending:false}),
      sb.from('contact_enquiries').select('*').order('created_at', {ascending:false})
    ]);
    if (results[0].data) DB.events       = results[0].data;
    if (results[1].data) DB.courses      = results[1].data;
    if (results[2].data) DB.gallery      = results[2].data;
    if (results[3].data) DB.slides       = results[3].data;
    if (results[4].data) { DB.settings={}; results[4].data.forEach(function(s){ DB.settings[s.key]=s.value; }); }
    if (results[5].data) DB.applications = results[5].data;
    if (results[6].data) DB.enquiries    = results[6].data;
  } catch(e) { toast('Load error: '+e.message, 'err'); }
  updateCounts();
  updateLiveBadge();
}

function S(k) { return DB.settings[k] || ''; }
function h(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function fmtD(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtTS(d) { if(!d) return ''; return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function imgFail(el) { el.onerror=null; el.style.background='#e2e8f0'; el.removeAttribute('src'); }

function updateCounts() {
  document.getElementById('cntApp').textContent    = DB.applications.length;
  document.getElementById('cntEnq').textContent    = DB.enquiries.length;
  document.getElementById('cntHero').textContent   = DB.slides.length;
  document.getElementById('cntCourse').textContent = DB.courses.length;
  document.getElementById('cntEvent').textContent  = DB.events.length;
  document.getElementById('cntGal').textContent    = DB.gallery.length;
}
function updateLiveBadge() {
  var live = DB.events.find(function(e){ return e.is_live; });
  var el = document.getElementById('liveBadge');
  if (live) {
    el.innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:.5rem"></i> LIVE: ' + h(live.title.substring(0,20));
    el.classList.add('live-on');
  } else {
    el.innerHTML = '<i class="fas fa-circle" style="font-size:.5rem"></i> No Live Stream';
    el.classList.remove('live-on');
  }
}

/* ── NAV ── */
function setupNav() {
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.addEventListener('click', function(){ renderPage(el.dataset.page); });
  });
}
function renderPage(page) {
  currentPage = page;
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.classList.toggle('on', el.dataset.page === page);
  });
  var map = {
    dashboard: pgDashboard,
    applications: pgApplications,
    enquiries: pgEnquiries,
    hero: pgHero,
    courses: pgCourses,
    events: pgEvents,
    gallery: pgGallery,
    settings: pgSettings,
    live: pgLive
  };
  var fn = map[page];
  document.getElementById('mainContent').innerHTML = fn ? fn() : '<p>Not found</p>';
}

/* ── TOAST ── */
function toast(msg, type) {
  type = type || 'ok';
  var iconMap = {ok:'fa-check-circle', err:'fa-exclamation-circle', info:'fa-info-circle'};
  var el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.innerHTML = '<i class="fas ' + (iconMap[type]||'fa-info-circle') + '"></i> ' + h(msg);
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}

/* ── MODAL ── */
function openModal(title, bodyHTML, footHTML, width) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFoot').innerHTML = footHTML || '<button class="btn btn-ghost" onclick="closeModal()">Close</button>';
  document.getElementById('modalBox').style.maxWidth = width || '680px';
  document.getElementById('globalModal').classList.add('on');
}
function closeModal() {
  document.getElementById('globalModal').classList.remove('on');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalFoot').innerHTML = '';
  editingId = null;
}
document.getElementById('globalModal').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

/* ── HELPERS for building HTML ── */
function fld(id, label, value, type, placeholder, extra) {
  type = type || 'text';
  var ph = placeholder ? ' placeholder="' + h(placeholder) + '"' : '';
  var ex = extra || '';
  return '<div class="fg"><label class="form-label">' + label + '</label>' +
    '<input id="' + id + '" type="' + type + '" value="' + h(value||'') + '"' + ph + ex + '></div>';
}
function fldTA(id, label, value, rows, placeholder) {
  rows = rows || 2;
  var ph = placeholder ? ' placeholder="' + h(placeholder) + '"' : '';
  return '<div class="fg s2"><label class="form-label">' + label + '</label>' +
    '<textarea id="' + id + '" rows="' + rows + '"' + ph + '>' + h(value||'') + '</textarea></div>';
}
function fldSel(id, label, options, selected) {
  var opts = options.map(function(o){
    var val = typeof o === 'object' ? o.v : o;
    var lbl = typeof o === 'object' ? o.l : o;
    return '<option value="' + h(val) + '"' + (val===selected?' selected':'') + '>' + h(lbl) + '</option>';
  }).join('');
  return '<div class="fg"><label class="form-label">' + label + '</label><select id="' + id + '">' + opts + '</select></div>';
}
function gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function gc(id) { var el = document.getElementById(id); return el ? el.checked : false; }

function buildAppRows(apps) {
  if (!apps.length) return '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray)">No applications found</td></tr>';
  return apps.map(function(a){
    var statusOpts = ['pending','contacted','approved','rejected'].map(function(s){
      return '<option value="' + s + '"' + (a.status===s?' selected':'') + '>' + s + '</option>';
    }).join('');
    return '<tr>' +
      '<td><strong>' + h(a.full_name) + '</strong><br><span style="font-size:.72rem;color:var(--gray)">' + h(a.email) + '</span></td>' +
      '<td>' + h(a.phone) + '</td>' +
      '<td>' + h(a.course_name) + '</td>' +
      '<td>' + h((a.county||'') + ' ' + (a.town||'')).trim() + '</td>' +
      '<td>' + fmtD(a.created_at) + '</td>' +
      '<td><select class="app-status-sel" data-appid="' + a.id + '" style="width:120px;font-size:.8rem;padding:5px 8px">' + statusOpts + '</select></td>' +
      '<td><div class="td-acts">' +
      '<button class="btn btn-sm btn-navy view-app-btn" data-appid="' + a.id + '"><i class="fas fa-eye"></i></button>' +
      '<a class="btn btn-sm btn-gold" href="https://wa.me/' + (a.phone||'').replace(/\D/g,'') + '" target="_blank"><i class="fab fa-whatsapp"></i></a>' +
      '<a class="btn btn-sm btn-outline" href="mailto:' + h(a.email) + '"><i class="fas fa-envelope"></i></a>' +

document.addEventListener('click', function(e){
  /* app filter buttons */
  if (e.target.classList.contains('app-filter-btn')) {
    document.querySelectorAll('.app-filter-btn').forEach(function(b){ b.classList.remove('btn-navy'); b.classList.add('btn-ghost'); });
    e.target.classList.remove('btn-ghost'); e.target.classList.add('btn-navy');
    var status = e.target.dataset.status;
    var filtered = status==='all' ? DB.applications : DB.applications.filter(function(a){ return a.status===status; });
    var tb = document.getElementById('appTbody');
    if (tb) tb.innerHTML = buildAppRows(filtered);
  }
  /* view application */
  if (e.target.closest('.view-app-btn')) {
    var id = e.target.closest('.view-app-btn').dataset.appid;
    viewApplication(id);
  }
  /* delete application */
  if (e.target.closest('.del-app-btn')) {
    var id = e.target.closest('.del-app-btn').dataset.appid;
    deleteApplication(id);
  }
  /* export csv */
  if (e.target.id === 'exportCsvBtn' || e.target.closest('#exportCsvBtn')) exportCSV();
});

document.addEventListener('change', function(e){

function viewApplication(id) {
  var a = DB.applications.find(function(x){ return x.id===id; });

  var fields = [
    ['Full Name',a.full_name],['Email',a.email],['Phone',a.phone],
    ['Date of Birth',fmtD(a.date_of_birth)],['Gender',a.gender],['National ID',a.national_id],
    ['County',a.county],['Town',a.town],['Guardian',a.guardian_name],
    ['Guardian Phone',a.guardian_phone],['Relationship',a.guardian_relationship],
    ['Education',a.highest_education],['School',a.school_name],['Grad Year',a.graduation_year],
    ['Course',a.course_name],['Level',a.study_level],['Mode',a.study_mode],
    ['Intake',a.intake_month],['How Heard',a.how_heard],['Applied',fmtTS(a.created_at)]
  ];
  var grid = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
    fields.map(function(kv){
      return '<div style="padding:10px 12px;background:var(--gray-lt);border-radius:8px">' +
        '<div style="font-size:.68rem;font-weight:700;color:var(--gray);margin-bottom:3px">' + kv[0] + '</div>' +
        '<div style="font-size:.83rem;color:var(--navy);font-weight:600">' + h(kv[1]||'') + '</div></div>';
    }).join('') + '</div>';

  var stmt = a.personal_statement ? '<div style="margin-top:14px;padding:14px;background:var(--navy);color:rgba(255,255,255,.82);border-radius:10px;font-size:.83rem"><strong style="color:var(--gold)">Personal Statement:</strong><br>' + h(a.personal_statement) + '</div>' : '';

  var docs = '<div style="margin-top:14px"><h4 style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:10px">Documents</h4><div style="display:flex;gap:10px;flex-wrap:wrap">' +
    (a.passport_photo_url ? '<a href="' + h(a.passport_photo_url) + '" target="_blank"><img src="' + h(a.passport_photo_url) + '" style="width:90px;height:70px;object-fit:cover;border-radius:8px;border:2px solid var(--border)" onerror="imgFail(this)"></a>' : '') +
    (a.national_id_front_url ? '<a href="' + h(a.national_id_front_url) + '" target="_blank" class="btn btn-sm btn-ghost"><i class="fas fa-id-card"></i> ID Front</a>' : '') +
    (a.national_id_back_url  ? '<a href="' + h(a.national_id_back_url)  + '" target="_blank" class="btn btn-sm btn-ghost"><i class="fas fa-id-card"></i> ID Back</a>'  : '') +
    (a.certificate_url       ? '<a href="' + h(a.certificate_url)       + '" target="_blank" class="btn btn-sm btn-ghost"><i class="fas fa-file"></i> Certificate</a>'  : '') +
    '</div></div>';

  var statusOpts = ['pending','contacted','approved','rejected'].map(function(s){
    return '<option value="' + s + '"' + (a.status===s?' selected':'') + '>' + s.charAt(0).toUpperCase()+s.slice(1) + '</option>';
  }).join('');

  var foot = '<select id="modalAppStatus" style="padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);font-family:Outfit,sans-serif;font-size:.83rem">' + statusOpts + '</select>' +
    '<button class="btn btn-red" id="modalSaveStatus"><i class="fas fa-save"></i> Update Status</button>' +
    '<a class="btn btn-gold" href="https://wa.me/' + (a.phone||'').replace(/\D/g,'') + '" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>' +
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>';

  openModal('Application — ' + h(a.full_name), grid + stmt + docs, foot, '780px');

  setTimeout(function(){
    var btn = document.getElementById('modalSaveStatus');
    if (btn) btn.addEventListener('click', function(){
      var sel = document.getElementById('modalAppStatus');
      if (sel) updateAppStatus(a.id, sel.value);
      closeModal();
    });
  }, 50);
}

async function updateAppStatus(id, status) {
  var res = await sb.from('applications').update({status:status}).eq('id',id);
  if (res.error) { toast('Update failed: '+res.error.message,'err'); return; }
  var a = DB.applications.find(function(x){ return x.id===id; });
  if (a) a.status = status;
  toast('Status updated: ' + status);
}

async function deleteApplication(id) {
  if (!confirm('Delete this application? Cannot be undone.')) return;
  var res = await sb.from('applications').delete().eq('id',id);
  if (res.error) { toast('Delete failed','err'); return; }
  DB.applications = DB.applications.filter(function(x){ return x.id!==id; });
  updateCounts(); renderPage('applications'); toast('Application deleted');
}

function exportCSV() {
  var cols = ['full_name','email','phone','course_name','study_level','study_mode','intake_month','county','town','highest_education','how_heard','status','created_at'];
  var rows = [cols.join(',')].concat(DB.applications.map(function(a){
    return cols.map(function(c){ return '"' + (a[c]||'').toString().replace(/"/g,'""') + '"'; }).join(',');
  }));
  var blob = new Blob([rows.join('\n')], {type:'text/csv'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'scti_applications_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
  toast('CSV exported');
}

    '<div style="text-align:center;padding:32px;background:var(--gray-lt);border-radius:12px;margin-bottom:16px">' +
    '<i class="fas fa-video" style="font-size:2.5rem;opacity:.2;color:var(--navy)"></i>' +
    '<p style="color:var(--gray);font-size:.85rem;margin-top:10px">No event is currently live</p></div>' +
    '<p style="font-size:.8rem;color:var(--gray)">Go to <strong>Events</strong> and check the Live toggle.</p>'
  );

  var eventList = DB.events.map(function(e){
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">' +
      '<div><p style="font-size:.83rem;font-weight:600;color:var(--navy)">' + h(e.title) + '</p>' +
      '<p style="font-size:.74rem;color:var(--gray)">' + fmtD(e.date) + '</p></div>' +
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
      '<input type="checkbox" class="event-live-chk" data-eid="' + e.id + '"' + (e.is_live?' checked':'') + '>' +
      (e.is_live ? '<span class="badge badge-live" style="font-size:.6rem">LIVE</span>' : '') +
      '</label></div>';
  }).join('') || '<p style="text-align:center;padding:20px;color:var(--gray)">No events yet</p>';

  setTimeout(function(){
    document.querySelectorAll('.stop-live-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleLive(btn.dataset.eid, false); });
    });
  }, 50);

  return '<div style="margin-bottom:20px"><h1 style="font-size:1.3rem;color:var(--navy)"><i class="fas fa-video" style="color:var(--red);margin-right:8px"></i>Live Stream Control</h1></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">' +
    '<div class="card"><div class="card-hdr"><div class="ch-left"><div class="ch-icon"><i class="fas fa-circle"></i></div><h2>Current Status</h2></div></div>' + statusHtml + '</div>' +
    '<div class="card"><div class="card-hdr"><div class="ch-left"><div class="ch-icon"><i class="fas fa-list"></i></div><h2>Set Event Live</h2></div></div>' + eventList + '</div></div>';
}

/* ── GLOBALS ── */
window.imgFail   = function(el){ el.onerror=null; el.style.background='#e2e8f0'; el.removeAttribute('src'); };
window.closeModal  = closeModal;
window.renderPage  = renderPage;

/* ── BOOT ── */
if (authed) initApp();

})();
</script>
</body>
</html>
