<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Application Status - SCTI</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#0a2540 0%,#0d3b5e 100%);min-height:100vh;padding:20px}
        .container{max-width:700px;margin:0 auto}
        .card{background:white;border-radius:22px;padding:40px;box-shadow:0 25px 50px rgba(0,0,0,0.3);margin-top:40px}
        .logo{display:flex;align-items:center;gap:12px;margin-bottom:30px;justify-content:center}
        .logo-mark{background:#C41E3A;width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:white}
        h1{font-family:'Syne',sans-serif;font-size:1.5rem;color:#0a2540;text-align:center;margin-bottom:8px}
        .sub{text-align:center;color:#666;margin-bottom:30px}
        input{width:100%;padding:14px 18px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;font-family:'Outfit',sans-serif;transition:all 0.3s}
        input:focus{outline:none;border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,0.1)}
        button{width:100%;margin-top:15px;padding:14px;background:#C41E3A;color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.3s}
        button:hover{background:#9e1830;transform:translateY(-2px)}
        .result{animation:fadeIn 0.5s ease;margin-top:30px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .app-card{border:1px solid #e0e0e0;border-radius:16px;padding:24px;margin-bottom:20px;background:#fafafa}
        .status-badge{display:inline-block;padding:5px 15px;border-radius:50px;font-size:12px;font-weight:700;text-transform:uppercase}
        .status-pending{background:#fff3cd;color:#856404}
        .status-contacted{background:#d1ecf1;color:#0c5460}
        .status-approved{background:#d4edda;color:#155724}
        .status-rejected{background:#f8d7da;color:#721c24}
        .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e0e0e0}
        .info-row:last-child{border-bottom:none}
        .info-label{font-weight:600;color:#555}
        .info-value{color:#1a1a2e}
        .message-box{background:#f0f8ff;padding:15px;border-radius:12px;margin-top:15px;border-left:4px solid #C41E3A}
        .help{text-align:center;margin-top:25px;padding-top:20px;border-top:1px solid #e0e0e0;font-size:13px;color:#666}
        .help a{color:#C41E3A;text-decoration:none}
        .loading{text-align:center;padding:40px}
        .spinner{width:40px;height:40px;border:3px solid #f3f3f3;border-top:3px solid #C41E3A;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .error{background:#f8d7da;color:#721c24;padding:15px;border-radius:12px;margin-top:20px}
        .back-home{display:inline-block;margin-top:20px;text-align:center;width:100%;color:#C41E3A;text-decoration:none;font-weight:600}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-mark">SC<br>TI</div>
            <div><strong style="font-size:1.1rem">SCTI</strong><br><small style="color:#666">Application Status</small></div>
        </div>
        <h1>🔍 Check Your Application Status</h1>
        <p class="sub">Enter your email address or phone number</p>
        
        <input type="text" id="searchInput" placeholder="Email or Phone Number" autocomplete="off">
        <button onclick="checkStatus()"><i class="fas fa-search"></i> Check Status</button>
        
        <div id="result"></div>
        
        <div class="help">
            <strong>📌 Need Help?</strong><br>
            Call us: <a href="tel:0113504043">0113 50 40 43</a> | 
            WhatsApp: <a href="https://wa.me/254113504043">+254 113 504 043</a><br>
            Email: <a href="mailto:skymocreativetraininginstitute@gmail.com">skymocreativetraininginstitute@gmail.com</a>
        </div>
        
        <a href="javascript:history.back()" class="back-home">← Back to Homepage</a>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://iuskmfphmraighipmsmh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1c2ttZnBobXJhaWdoaXBtc21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODEyOTYsImV4cCI6MjA5NDE1NzI5Nn0.Yfbj26m0cxGfCBTvEmuPAXpemLPhxBws8N3JvHF1HFI';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function checkStatus() {
    const searchTerm = document.getElementById('searchInput').value.trim();
    const resultDiv = document.getElementById('result');
    
    if (!searchTerm) {
        resultDiv.innerHTML = '<div class="error">⚠️ Please enter your email or phone number</div>';
        return;
    }
    
    resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:15px">Checking your application...</p></div>';
    
    const { data, error } = await supabase
        .from('applications')
        .select('full_name, email, phone, course_name, status, created_at, study_mode, intake_month, updated_at')
        .or(`email.eq.${searchTerm},phone.eq.${searchTerm}`)
        .order('created_at', { ascending: false });
    
    if (error) {
        resultDiv.innerHTML = `<div class="error">❌ Error checking status. Please try again later.</div>`;
        return;
    }
    
    if (!data || data.length === 0) {
        resultDiv.innerHTML = `<div class="error">🔍 No application found with "${searchTerm}".<br><br>Please check your email/phone or contact our admissions office.</div>`;
        return;
    }
    
    let html = '';
    data.forEach(app => {
        const statusConfig = {
            pending: { text: '📋 Pending Review', class: 'status-pending', message: 'Your application is being reviewed by our admissions team. We will contact you within 3-5 business days.' },
            contacted: { text: '📞 Contacted', class: 'status-contacted', message: 'Our team has reviewed your application and will contact you shortly to discuss the next steps.' },
            approved: { text: '✅ Approved!', class: 'status-approved', message: 'Congratulations! Your application has been approved. You will receive registration details via email within 24 hours.' },
            rejected: { text: '❌ Not Selected', class: 'status-rejected', message: 'We regret to inform you that your application was not successful at this time. We encourage you to apply for other programs.' }
        };
        const config = statusConfig[app.status] || statusConfig.pending;
        
        html += `
            <div class="app-card">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px">
                    <h3 style="color:#0a2540">${escapeHtml(app.full_name)}</h3>
                    <span class="status-badge ${config.class}">${config.text}</span>
                </div>
                <div class="info-row"><span class="info-label">📧 Email:</span><span class="info-value">${escapeHtml(app.email)}</span></div>
                <div class="info-row"><span class="info-label">📞 Phone:</span><span class="info-value">${escapeHtml(app.phone)}</span></div>
                <div class="info-row"><span class="info-label">📚 Course:</span><span class="info-value">${escapeHtml(app.course_name)}</span></div>
                <div class="info-row"><span class="info-label">🎓 Study Mode:</span><span class="info-value">${escapeHtml(app.study_mode || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">📅 Intake:</span><span class="info-value">${escapeHtml(app.intake_month || 'N/A')}</span></div>
                <div class="info-row"><span class="info-label">📆 Applied:</span><span class="info-value">${new Date(app.created_at).toLocaleDateString()}</span></div>
                <div class="info-row"><span class="info-label">🕒 Last Updated:</span><span class="info-value">${new Date(app.updated_at || app.created_at).toLocaleDateString()}</span></div>
                <div class="message-box">
                    <strong>📢 Status Update:</strong><br>
                    ${config.message}
                </div>
            </div>
        `;
    });
    resultDiv.innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkStatus();
});
</script>
</body>
</html>
